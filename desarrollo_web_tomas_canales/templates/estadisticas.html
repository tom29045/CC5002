<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Red de Observación</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/simple.css') }}">
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>
<body>

<header>
    <h1>Estadísticas de la Plataforma</h1>
    <nav>
        <ul>
            <li><a href="{{ url_for('index') }}">Inicio</a></li>
            <li><a href="{{ url_for('registro_voluntario') }}">Registrar Voluntario</a></li>
            <li><a href="{{ url_for('reporte_avistamiento') }}">Reportar Avistamientos</a></li>
            <li><a href="{{ url_for('listado_avistamientos') }}">Listado de Avistamientos</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h2>Avistamientos por Día</h2>
        <figure id="grafico-lineas" style="width: 100%; height: 400px; margin: 0;"></figure>
    </section>

    <hr>

    <section>
        <h2>Avistamientos por Tipo de Ave</h2>
        <figure id="grafico-torta" style="width: 100%; height: 400px; margin: 0;"></figure>
    </section>

    <hr>

    <section>
        <h2>Voluntarios por Comuna</h2>
        <figure id="grafico-barras" style="width: 100%; height: 400px; margin: 0;"></figure>
    </section>

    <p>
        <a href="{{ url_for('listado_avistamientos') }}">Ir al listado</a> |
        <a href="{{ url_for('index') }}">Regresar a inicio</a>
    </p>
</main>

<script src="{{ url_for('static', filename='js/estadisticas.js') }}"></script>
</body>
</html>
